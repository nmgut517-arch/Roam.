    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; text-align: center;

    h1 { margin: 0 0 12px; font-weight: 500; font-size: clamp(40px, 8vw, 72px); letter-spacing: -.04em; line-height: 1; }
    h1 em { font-family: "Instrument Serif", serif; font-weight: 400; color: var(--accent); }
    p { margin: 0 0 32px; color: var(--muted); }
    a { display: inline-block; padding: 14px 24px; border-radius: 999px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
